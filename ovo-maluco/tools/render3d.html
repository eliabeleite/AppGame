</head><body style="margin:0;background:#fff8e6">
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { LISTA, build } from './modelos.js';

const SIZE = 760;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const YAW = { tralalero: .55, bombardiro: .6, gusini: .55, trippi: .25 };

function render(id) {
  const scene = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture;
  scene.add(new THREE.HemisphereLight(0xfff6e0, 0x8a7a6a, .9));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 6, 5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -.0005;
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: .1, far: 20 });
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xbfe4ff, 1.2); rim.position.set(4, 3, -4); scene.add(rim);

  const g = build(id);
  // contorno de desenho animado (casca invertida empurrada pela normal)
  const outlineMat = (k) => new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { th: { value: k } },
    vertexShader: 'uniform float th; void main(){ vec3 p = position + normalize(normal) * th; gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0); }',
    fragmentShader: 'void main(){ gl_FragColor = vec4(0.23,0.14,0.08,1.0); }' });
  g.updateMatrixWorld(true);
  const meshes = []; g.traverse(o => { if (o.isMesh) meshes.push(o); });
  for (const m of meshes) {
    if (!m.geometry.attributes.normal) continue;
    const ws = new THREE.Vector3(); m.getWorldScale(ws); const sc = (Math.abs(ws.x) + Math.abs(ws.y) + Math.abs(ws.z)) / 3;
    const o = new THREE.Mesh(m.geometry, outlineMat(.016 / Math.max(.05, sc))); o.castShadow = false; m.add(o);
  }
  g.rotation.y = YAW[id] ?? -.3;
  scene.add(g);
  const box = new THREE.Box3().setFromObject(g);
  const c = box.getCenter(new THREE.Vector3());
  g.position.x -= c.x; g.position.z -= c.z; g.position.y -= box.min.y;
  const box2 = new THREE.Box3().setFromObject(g), sph = box2.getBoundingSphere(new THREE.Sphere());

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: .22 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  const fov = 26, cam = new THREE.PerspectiveCamera(fov, 1, .1, 100);
  const dist = sph.radius / Math.sin(THREE.MathUtils.degToRad(fov / 2)) * 1.02;
  const dir = new THREE.Vector3(0, .32, 1).normalize();
  cam.position.copy(sph.center).addScaledVector(dir, dist);
  cam.lookAt(sph.center);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, cam);
  pm.dispose();
  return renderer.domElement.toDataURL('image/png');
}
window.LISTA = LISTA;
window.renderOne = render;
window.ready = true;
</script></body></html>
